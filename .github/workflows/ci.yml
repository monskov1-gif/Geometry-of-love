# Checks every pull request and every push to a non-main branch.
# Publishing happens only in deploy.yml (push to main).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (engine + content validation)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Production build has no test hook
        run: "! grep -q __golTest dist/assets/*.js"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (served under /Geometry-of-love/)
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
